# Purpose: Route usage questions toward the details and support resources that
# maintainers need. Questions intentionally receive no generic "needs triage"
# label or Bug metadata automation.
name: Question ❓
description: Usage question or discussion about Carbon components.
title: '[Question]: '
labels: ['type: question ❓']
body:
  - type: markdown
    attributes:
      value: '## Hi there! 👋'
  - type: markdown
    attributes:
      value:
        Hope everything is going okay using projects from the Carbon Design
        System. It looks like you might have a question about our work, so we
        wanted to share a couple of resources that you could use if you haven't
        tried them yet 🙂
  - type: markdown
    attributes:
      value:
        If you're an IBMer, you can ask questions about the Carbon Design
        System, `@carbon/react`, and `@carbon/web-components` in
        `#carbon-design-system`, available across all IBM Slack workspaces.
  - type: markdown
    attributes:
      value:
        For everyone else, you can ask a question on our [GitHub Discussions
        board](https://github.com/carbon-design-system/carbon/discussions/new)
        or join [our Discord server](https://discord.gg/J7JEUEkTRX) to chat with
        Carbon maintainers and fellow community members.
  - type: textarea
    id: summary
    attributes:
      label: Question for Carbon
      description: 'Let us know how we can help!'
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: Please confirm the following
      options:
        - label:
            I agree to follow this project's [Code of
            Conduct](https://github.com/carbon-design-system/carbon/blob/main/.github/CODE_OF_CONDUCT.md)
          required: true
  - type: markdown
    attributes:
      value: |
        > [!TIP]
        >
        > You do not need to apply labels. Labels are applied automatically and by the Carbon team when your issue is triaged.
