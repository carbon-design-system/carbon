# https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#force-deleting-cache-entries
#
# Uses pull_request_target so the GITHUB_TOKEN retains write access when a PR
# from a fork is closed/merged. pull_request always receives a read-only token
# for forks, which causes intermittent 403s on createComment. This workflow does
# not check out or execute PR code, so pull_request_target is safe here.
name: Pull request closed
on:
  pull_request_target:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup up branch cache
        run: |
          gh extension install actions/gh-actions-cache

          echo "Fetching list of cache keys"
          cacheKeysForPR=$(gh actions-cache list -R $REPO -B $BRANCH -L 100 | cut -f 1 )

          ## Setting this to not fail the workflow while deleting cache keys.
          set +e
          echo "Deleting caches..."
          for cacheKey in $cacheKeysForPR
          do
              gh actions-cache delete $cacheKey -R $REPO -B $BRANCH --confirm
          done
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
  if_merged:
    if: github.event.pull_request.merged == true
    permissions:
      # createComment uses the Issues API; both scopes are required
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Comment the schedule release
        id: conditional-comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const commentText = "The content of this pull request will be made available as part of our next release. For the full schedule of upcoming releases, check out our [Release Radar](https://github.com/carbon-design-system/carbon/wiki/Release-radar) page."

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentText
            });
      - name: Set Output
        if: steps.conditional-comment.outcome == 'success'
        run: echo "Comment added successfully."
