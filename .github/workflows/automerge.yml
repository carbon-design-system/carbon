# This workflow merges the main branch into the next (v12) branch every night to keep the branch up to date.
name: Automerge

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows you to run this manually

jobs:
  merge:
    name: Merge main into next
    runs-on: ubuntu-latest
    if: github.repository == 'carbon-design-system/carbon'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          ref: next

      - name: Merge main into next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "next already contains main; nothing to merge."
            exit 0
          fi

          if ! git merge origin/main --no-edit; then
            echo "Merge conflict detected. Opening a PR from main into next."
            git merge --abort

            # Open a PR only if one doesn't already exist
            EXISTING_PR=$(gh pr list --base next --head main --state open --json number --jq '.[0].number')
            if [ -n "$EXISTING_PR" ]; then
              echo "PR #$EXISTING_PR already open for main -> next; skipping."
            else
              gh pr create \
                --base next \
                --head main \
                --title "chore: merge main into next" \
                --body "This PR was automatically opened because an automatic merge of \`main\` into \`next\` resulted in a merge conflict. Please resolve the conflicts and merge."
            fi
            exit 1
          fi

          git push origin HEAD:next
