name: Release

on:
  push:
    tags:
      # Push events to matching v*, i.e. v1.0, v20.15.10
      - 'v*'
      # Ignore tags for v10, there is a separate v10-release.yml workflow for v10
      - '!v10*'

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest-larger-disk
    timeout-minutes: 60
    # Needed as recommended by npm docs on publishing with provenance https://docs.npmjs.com/generating-provenance-statements
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --immutable --check-cache

      # For generating playwright json report for avt tests.
      # Skipped for v12 tags, including alpha releases.
      - name: Install browsers
        if: startsWith(github.ref_name, 'v12') == false
        run: yarn playwright install --with-deps

      - name: Build project
        run: yarn build

      # Additional steps for generating playwright json report for avt tests.
      # Skipped for v12 tags, including alpha releases.
      - name: Build storybook
        if: startsWith(github.ref_name, 'v12') == false
        run: yarn workspace @carbon/react storybook:build
      - name: Run storybook
        id: storybook
        if: startsWith(github.ref_name, 'v12') == false
        run: |
          npx serve -l 3000 packages/react/storybook-static &
          pid=$!
          echo ::set-output name=pid::"$pid"
      - uses: ./actions/wait-for-it
        if: startsWith(github.ref_name, 'v12') == false
        with:
          URL: 'http://localhost:3000'
        timeout-minutes: 3
      - name: Run AVT
        if: github.repository == 'carbon-design-system/carbon' && startsWith(github.ref_name, 'v12') == false
        run: |
          yarn playwright test --project chromium --grep @avt
      - name: Stop storybook
        if: startsWith(github.ref_name, 'v12') == false
        run: kill ${{ steps.storybook.outputs.pid }}
      - name: Upload test results
        if: always() && startsWith(github.ref_name, 'v12') == false
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-avt-report
          path: .playwright

      - name: Run Continuous Integration checks
        run: yarn ci-check

      - name: Set dist-tag
        run: |
          if [[ "${{ github.ref_name }}" == *"-alpha"* ]]; then
            echo "DIST_TAG=v12-alpha" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == *"-rc"* ]]; then
            echo "DIST_TAG=next" >> $GITHUB_ENV
          else
            echo "DIST_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Publish packages
        run: |
          yarn lerna publish from-package --dist-tag "$DIST_TAG" \
            --no-verify-access --yes

      - name: Create Release
        id: create_release
        if: contains(github.ref_name, '-alpha') == false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            github.rest.repos.createRelease({
              tag_name: context.ref,
              name: '${{ github.ref_name }}',
              draft: false,
              prerelease: true,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

  packages:
    needs: build
    runs-on: ubuntu-latest
    # only trigger for stable releases, not release candidates or v12 alphas
    if: contains(github.ref_name, '-rc') == false && contains(github.ref_name, '-alpha') == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # run deploy-packages workflow
      - name: Deploy packages
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: deploy-packages

  publish-icons-pictograms-cdn:
    # wait for `build` to publish to npm, so CDN only serves released assets
    needs: build
    # stable releases only, no prereleases
    if: contains(github.ref_name, '-') == false
    permissions:
      contents: read
    uses: ./.github/workflows/publish-icons-pictograms-cdn.yml
    secrets: inherit
