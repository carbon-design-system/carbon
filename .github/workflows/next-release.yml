name: Next release (v12 alpha)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        required: true
        description: 'Run dry run?'
        type: boolean
        default: true

jobs:
  version:
    name: Version and tag
    runs-on: ubuntu-latest-larger-disk
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Generate token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate_token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Determine next alpha tag
        id: next_tag
        run: |
          latest=$(git tag --list 'v12.*-alpha.*' --sort=-version:refname | grep -E '^v12\.[0-9]+\.[0-9]+-alpha\.[0-9]+$' | head -n 1 || true)
          if [ -z "$latest" ]; then
            echo "No existing alpha tag found"
            exit 1
          fi
          prefix="${latest%.*}"
          number="${latest##*.}"
          next="${prefix}.$((number + 1))"
          echo "Latest alpha tag: $latest"
          echo "Next alpha tag: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --immutable --check-cache

      - name: Version packages
        run: |
          yarn lerna version prerelease --preid alpha --no-git-tag-version \
            ${{ github.event.inputs.dry_run != 'true' && '--yes' || '' }}

      - name: Commit version bumps
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "lerna version produced no changes"
            exit 1
          fi
          git add -A
          git commit -m "chore(release): ${{ steps.next_tag.outputs.tag }}"
          git push origin HEAD:next

      - name: Create git tag
        if: github.event.inputs.dry_run != 'true'
        run: |
          git tag -a "${{ steps.next_tag.outputs.tag }}" -m "${{ steps.next_tag.outputs.tag }}"
          git push origin "refs/tags/${{ steps.next_tag.outputs.tag }}"
