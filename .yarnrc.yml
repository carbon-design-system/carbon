compressionLevel: mixed

enableGlobalCache: true

nodeLinker: node-modules

# Only install optional platform packages for the machine running the install.
# This used to list every platform because the Yarn cache was committed to the
# repo (zero-installs) and had to work everywhere; that cache was removed in
# #21623.
supportedArchitectures:
  cpu:
    - current
  libc:
    - current
  os:
    - current

yarnPath: .yarn/releases/yarn-4.10.3.cjs
