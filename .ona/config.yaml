      ready: curl -fsS http://localhost:3012/ >/dev/null
    readinessTimeout: 900s
    triggeredBy:
      - manual
      - postEnvironmentStart

  web-components-storybook:
    name: Web Components Storybook
    description: Run the current Web Components development server.
    commands:
      start: |
        ona environment port open 6011 --admission creator_only --name "Web Components Storybook" --protocol http
        export ONA_EXPOSED_HOST="$(ona environment port get 6011 -f URL | cut -c 9-)"
        export __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$ONA_EXPOSED_HOST"
        exec yarn workspace @carbon/web-components storybook --host 0.0.0.0 --ci
      ready: curl -fsS http://localhost:6011/ >/dev/null
    readinessTimeout: 900s
    triggeredBy:
      - manual
      - postEnvironmentStart

  web-components-v12-storybook:
    name: Web Components v12 Storybook
    description: Run the Web Components v12-preview development server.
    commands:
      start: |
        ona environment port open 6012 --admission creator_only --name "Web Components v12 Storybook" --protocol http
        export ONA_EXPOSED_HOST="$(ona environment port get 6012 -f URL | cut -c 9-)"
        export __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$ONA_EXPOSED_HOST"
        exec yarn workspace @carbon/web-components storybook:v12 --host 0.0.0.0 --ci
      ready: curl -fsS http://localhost:6012/ >/dev/null
    readinessTimeout: 900s
    triggeredBy:
      - manual
      - postEnvironmentStart
