<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empty State Pattern Example — @carbon/web-components</title>
    <link rel="stylesheet" href="./index.scss" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div>
      <div style="padding: 1rem; background: #f4f4f4; margin-bottom: 2rem;">
        <h1 style="font-size: 1.5rem; margin-bottom: 1rem;">
          Empty State Pattern Examples
        </h1>

        <section style="margin-bottom: 2rem;">
          <h2 style="font-size: 1.125rem; margin-bottom: 1rem;">
            Empty State unit with isometric illustration
          </h2>
          <cds-empty-state-isometric></cds-empty-state-isometric>
        </section>

        <section style="margin-bottom: 2rem;">
          <h2 style="font-size: 1.125rem; margin-bottom: 1rem;">
            Empty State unit with pictogram illustration
          </h2>
          <cds-empty-state-pictogram></cds-empty-state-pictogram>
        </section>
      </div>

      <section>
        <div style="padding: 0.5rem 1rem; background: #e0e0e0;">
          <h2 style="font-size: 1.125rem; margin: 0 0 0.5rem;">
            Empty State unit
          </h2>
        </div>
        <cds-empty-state-unit></cds-empty-state-unit>
      </section>
    </div>
