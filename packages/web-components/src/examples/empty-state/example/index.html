<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empty State Pattern Example — @carbon/web-components</title>
    <link rel="stylesheet" href="./src/index.scss" />
    <script type="module" src="./src/main.ts"></script>
    <script type="module" src="./src/stories-menu.ts"></script>
  </head>
  <body>
    <div>
      <div style="padding: 1rem; background: #f4f4f4;">
        <h1 style="font-size: 1.5rem; margin-bottom: 1rem;">
          Empty State Pattern Examples
        </h1>
        <div
          id="story-buttons"
          style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
          <cds-button size="sm" kind="tertiary" data-story="default">
            Default
          </cds-button>
          <cds-button size="sm" kind="tertiary" data-story="isometric">
            Unit with isometric illustration
          </cds-button>
          <cds-button size="sm" kind="tertiary" data-story="pictogram">
            Unit with pictogram illustration
          </cds-button>
          <cds-button size="sm" kind="tertiary" data-story="ui">
            In a UI
          </cds-button>
          <cds-button size="sm" kind="tertiary" data-story="no-data">
            NoDataEmptyState
          </cds-button>
          <cds-button size="sm" kind="tertiary" data-story="error">
            ErrorEmptyState
          </cds-button>
          <cds-button size="sm" kind="tertiary" data-story="not-found">
            NotFoundEmptyState
          </cds-button>
          <cds-button size="sm" kind="tertiary" data-story="notifications">
            NotificationsEmptyState
          </cds-button>
          <cds-button size="sm" kind="tertiary" data-story="unauthorized">
            UnauthorizedEmptyState
          </cds-button>
          <cds-button size="sm" kind="tertiary" data-story="no-tags">
            NoTagsEmptyState
          </cds-button>
        </div>
      </div>

      <div id="story-outlet" style="padding: 2rem;"></div>
    </div>
  </body>
</html>
